[project]
name = "task-spec-format"
version = "0.1.0"
description = "Frozen JSONL task contract and strict validator for an LLM eval harness"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["main.py"]
