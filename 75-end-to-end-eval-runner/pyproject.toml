[project]
name = "end-to-end-eval-runner"
version = "0.1.0"
description = "Compose task specs, model adapters, metrics, calibration, and a leaderboard into one eval run"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "eval_runner"]
